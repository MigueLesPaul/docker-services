- id: '1782507671321'
  alias: Radio matutino
  description: ''
  triggers:
  - trigger: time
    at: 08:00:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  conditions: []
  actions:
  - action: media_player.play_media
    metadata: {}
    target:
      device_id: 1665b1c8971c9d7f7170ffa1be0300f8
    data:
      media:
        media_content_id: media-source://radio_browser/db656299-a63e-4b7b-ac5a-ac2444459ae4
        media_content_type: audio/mpeg
        metadata:
          title: RNE - R1 --> Madrid
          thumbnail: https://img2.rtve.es/a/3893534/square/?h=320
          media_class: music
          children_media_class:
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://radio_browser
          - media_content_type: music
            media_content_id: media-source://radio_browser/country/ES
          browse_entity_id: media_player.music_player_daemon
  - action: media_player.volume_set
    metadata: {}
    data:
      volume_level: 0.7
    target:
      entity_id: media_player.music_player_daemon
  mode: single
