pages:
  - name: Home
    # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
    # hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones: 
              #- timezone: Europe/Madrid
              #  label: Madrid
              - timezone: America/Havana
                label: La Habana
          #- type: calendar
          #first-day-of-week: monday

          - type: rss
            limit: 10
            collapse-after: 3
            cache: 12h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                limit: 4
              - url: https://ciechanow.ski/atom.xml
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau
              - url: https://samwho.dev/rss.xml
              - url: https://ishadeed.com/feed.xml
                title: Ahmad Shadeed

          #- type: twitch-channels
          #  channels:
          #    - theprimeagen
          #    - j_blow
          #    - giantwaffle
          #    - cohhcarnage
          #    - christitustech
          #    - EJ_SA

      - size: full
        widgets:
          - type: group
            widgets:
              - type: hacker-news
              - type: lobsters
              - type: rss
                limit: 10
                title: US
                #style: horizontal-cards
                feeds:
                  - url: https://feeds.bloomberg.com/markets/news.rss
                    title: Bloomberg
                  - url: https://moxie.foxbusiness.com/google-publisher/markets.xml
                    title: Fox Business
                  - url: https://moxie.foxbusiness.com/google-publisher/technology.xml
                    title: Fox Business
              - type: rss
                limit: 10
                title: Cuba
                feeds: 
                  - url: https://www.tribuna.cu/feed/
                    title: Tibuna de La Habana
                  - url: https://www.granma.cu/feed
                    title: Granma
                  - url: http://www.cubadebate.cu/feed/
                    title: Cubadebate
              - type: rss
                limit: 10
                title: España
                feeds:
                  - url: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/ultimas-noticias/portada
                    title: El País
                  - url: https://rss.elconfidencial.com/espana/
                    title: El Confidencial
              - type: rss
                limit: 10
                title: Francophonie
                feeds:
                  - url: https://www.france24.com/fr/rss
                    title: France24
                  - url: https://www.lemonde.fr/international/rss_full.xml 
                    title: LeMonde
              - type: rss
                limit: 10
                title: World
                feeds: 
                  - url: https://feeds.bbci.co.uk/news/world/rss.xml
                    title: BBC

          - type: videos
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
              - UCsBjURrPoezykLs9EqgamOA # Fireship
              - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
              - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium

          - type: group
            widgets:
              - type: reddit
                subreddit: technology
                show-thumbnails: true
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true
              - type: reddit
                subreddit: linux 
                show-thumbnails: true

      - size: small
        widgets:
          - type: weather
            location: Madrid, Spain
            units: metric # alternatively "imperial"
            hour-format: 24h # alternatively "24h"
            # Optionally hide the location from being displayed in the widget
            # hide-location: true

          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: NVDA
                name: NVIDIA
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft

          - type: releases
            cache: 1d
            # Without authentication the Github API allows for up to 60 requests per hour. You can create a
            # read-only token from your Github account settings and use it here to increase the limit.
            # token: ...
            repositories:
              - glanceapp/glance
              - go-gitea/gitea
              - immich-app/immich
              - syncthing/syncthing
  - name: Kalpa Imperial
    head-widgets:
      - type: server-stats
        servers:
          - type: local
            name: Kalpa Resources

    columns:
      - size: small
        widgets:
          - type: bookmarks 
            groups: 
              - title: Files
                links:
                  - title: Syncthing
                    url: http://pve-kalpa:8384/
                  - title: Jellyfin
                    url: http://pve-kalpa:8096/
      - size: full
        widgets: 
          - type: docker-containers 
  - name: News
    columns: 
      - size: small
        widgets:
      - size: full
        widgets: 
  - name: Videos
    columns:
      - size: full
        widgets: 
          - type: rss
            limit: 10
            title: US
            #style: horizontal-cards
            feeds:
              - url: https://feeds.bloomberg.com/markets/news.rss
                title: Bloomberg
              - url: https://moxie.foxbusiness.com/google-publisher/markets.xml
                title: Fox Business
              - url: https://moxie.foxbusiness.com/google-publisher/technology.xml
                title: Fox Business
          - type: rss
            limit: 10
            title: Cuba
            feeds: 
              - url: https://www.tribuna.cu/feed/
                title: Tibuna de La Habana
              - url: https://www.granma.cu/feed
                title: Granma
              - url: http://www.cubadebate.cu/feed/
                title: Cubadebate
          - type: rss
            limit: 10
            title: España
            feeds:
              - url: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/ultimas-noticias/portada
                title: El País
              - url: https://rss.elconfidencial.com/espana/
                title: El Confidencial
          - type: rss
            limit: 10
            title: Francophonie
            feeds:
              - url: https://www.france24.com/fr/rss
                title: France24
              - url: https://www.lemonde.fr/international/rss_full.xml 
                title: LeMonde
          - type: rss
            limit: 10
            title: World
            feeds: 
              - url: https://feeds.bbci.co.uk/news/world/rss.xml
                title: BBC



