version: '3.8'
services:
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"       # DNS over TCP
      - "53:53/udp"       # DNS over UDP
      - "67:67/udp"       # DHCP (v4)
      - "68:68/udp"       # DHCP (v4)
      - "81:80/tcp"       # HTTP admin interface
      - "444:443/tcp"     # HTTPS admin interface
      - "444:443/udp"     # QUIC/HTTP3
      - "3000:3000/tcp"   # Alternative admin port
      - "853:853/tcp"     # DNS-over-TLS
      - "784:784/udp"     # DNS-over-QUIC
      - "853:853/udp"     # DNS-over-QUIC (alternative)
      - "8853:8853/udp"   # DNS-over-QUIC (cloudflare)
      - "5443:5443/tcp"   # DNSCrypt
      - "5443:5443/udp"   # DNSCrypt
    volumes:
      - /home/miguel/homelab/adguard-home/work:/opt/adguardhome/work
      - /home/miguel/homelab/adguard-home/conf:/opt/adguardhome/conf

