version: "2.1"
services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin
    network_mode: "bridge"
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - 8096:8096
    volumes:
      - /home/kalpa/homelab-config/jellyfin/config:/config
      - /home/kalpa/homelab-config/jellyfin/cache:/cache
      - type: bind
        source: /home/kalpa/ext-hdd/GROUGE/Series
        target: /media
        read_only: true
      - type: bind
        source: /home/kalpa/ext-hdd/GROUGE/Pelis
        target: /media2
        read_only: true
            #- type: bind
        #source: /home/miguel/Books
        #target: /media3
        #read_only: true

      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      #- type: bind
      #  source: /path/to/fonts
      #  target: /usr/local/share/fonts/custom
      # read_only: true
    restart: "unless-stopped"
    # Optional - alternative address used for autodiscovery
    #environment:
    # - JELLYFIN_PublishedServerUrl=http://example.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    #extra_hosts:
    #  - 'host.docker.internal:host-gateway'
