  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      # - TZ=Africa/Casablanca
      - WEBUI_PORT=8097
      #- WEBUI_USER=miguel  # Check image documentation
      - WEBUI_PASSWORD=migue
      - WEBUI_USERNAME=miguel
      - QBITTORRENT_WEBUI_ADDRESS=0.0.0.0

    volumes:
      - /home/kalpa/homelab-config/mediarr/qbittorrent:/config
      - myDlFolders:/downloads
    ports:
      - 8097:8097
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    network_mode: "bridge"
    environment:
      - PUID=1000
      - PGID=1000
      # - TZ=Africa/Casablanca
    volumes:
      - /home/kalpa/homelab-config/mediarr/radarr:/config
      - myMedia:/tv
      - myDlFolders:/mnt/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
    depends_on:
      - prowlarr
      - qbittorrent
      - jellyfin

