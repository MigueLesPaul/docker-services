  #   restart: unless-stopped

networks:
  mediarr:
    driver: bridge
volumes:
  myMedia:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kalpa/ext-hdd/GROUGE/Series

  myDlFolders:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kalpa/Downloads/qBittorrent

