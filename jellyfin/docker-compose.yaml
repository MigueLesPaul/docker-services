        #  - prowlarr
        #   - qbittorrent
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    network_mode: "bridge"
    environment:
      - PUID=1000
      - PGID=1000
    #   - TZ=Africa/Casablanca
    volumes:
      - /home/kalpa/homelab-config/mediarr/sonarr:/config
      - myMedia:/tv
      - myDlFolders:/mnt/downloads
    depends_on:
      - prowlarr
      - qbittorrent
      - jellyfin
    ports:
      - 8989:8989
    restart: unless-stopped
